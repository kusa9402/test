<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLUE FAIRY</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style id="app-style">:root{
  --bg:#EEF5FC; --surface:#FFFFFF; --surface-2:#E2EDF8; --ink:#0F2440; --ink-2:#496184; --line:#C3D8EE;
  --head:#A9CBEB; --head-ink:#0F2A4D; --hover:rgba(255,255,255,.42);
  --start:#1F5C9C; --band:#0E2748; --band-2:#164478; --band-ink:#F2F8FF;
  --accent:#2478D6; --accent-ink:#FFFFFF; --danger:#C0392B; --ok:#1E8E5A;
  --tile-a:#1B6A8F; --tile-b:#123F6B; --shadow:0 10px 30px rgba(15,60,120,.16);
  --serif:"Gowun Batang","Noto Serif KR","Nanum Myeongjo",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --panel-w:380px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08111F; --surface:#0F1D33; --surface-2:#162A49; --ink:#E5F0FF; --ink-2:#94ABCE; --line:#23395B;
    --head:#12294C; --head-ink:#DCEBFF; --hover:rgba(255,255,255,.09);
    --start:#2F7FD8; --band:#050D1A; --band-2:#0F3160;
    --accent:#4DA3FF; --accent-ink:#04101F; --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#0F1D33; --surface-2:#162A49; --ink:#E5F0FF; --ink-2:#94ABCE; --line:#23395B;
  --head:#12294C; --head-ink:#DCEBFF; --hover:rgba(255,255,255,.09);
  --start:#2F7FD8; --band:#050D1A; --band-2:#0F3160;
  --accent:#4DA3FF; --accent-ink:#04101F; --shadow:0 10px 30px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(88px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3,p,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ---------- header ---------- */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:var(--head);color:var(--head-ink);border-bottom:1px solid rgba(15,42,77,.14)}
.hd-in{display:flex;align-items:center;gap:22px;height:76px;padding-left:20px}
.brand{display:flex;align-items:center;flex:none}
.brand img{height:62px;width:auto;display:block}
.nav>ul{display:flex;gap:2px}
.nav li{position:relative}
.nav a{display:block;padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:500;font-size:15px;white-space:nowrap}
.nav>ul>li>a:hover,.nav>ul>li:focus-within>a,.nav li.act>a{background:var(--hover)}
.nav>ul>li.act>a{font-weight:700}
.nav li.has>a::after{content:"";display:inline-block;width:5px;height:5px;margin:0 0 3px 8px;border:solid currentColor;border-width:0 1.6px 1.6px 0;transform:rotate(45deg);opacity:.6}
.nav ul.sub{position:absolute;left:0;top:100%;min-width:176px;padding:6px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:none;z-index:60}
.nav ul.sub ul.sub{left:100%;top:-7px}
.nav li:hover>ul.sub,.nav li:focus-within>ul.sub{display:block}
.nav ul.sub a{padding:9px 12px;font-size:14px}
.nav ul.sub li.has>a::after{transform:rotate(-45deg);float:right;margin:8px 2px 0 12px}
.nav ul.sub a:hover,.nav ul.sub li.act>a{background:var(--surface-2)}
.util{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;white-space:nowrap}
.util a{text-decoration:none;padding:4px 2px}
.util a:hover{text-decoration:underline}
.util .sep{opacity:.45}
.pc{display:flex;align-items:center;gap:8px}
.sw{position:relative;width:52px;height:26px;border-radius:999px;border:1.5px solid var(--start);background:var(--surface);cursor:pointer;padding:0;display:block}
.sw b{position:absolute;top:2px;bottom:2px;width:22px;border-radius:999px;background:var(--start);left:2px;transition:left .18s}
.sw[aria-checked="true"] b{left:calc(100% - 24px)}
.sw span{position:absolute;top:0;bottom:0;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--start);width:26px}
.sw span.l{left:0}.sw span.r{right:0}
.sw[aria-checked="true"] span.l{color:var(--start)}
.start{align-self:stretch;display:grid;place-items:center;padding:0 36px;background:var(--start);color:#fff;text-decoration:none;font:700 20px/1.1 var(--serif);letter-spacing:.06em;text-align:center;transition:filter .15s}
.start:hover{filter:brightness(1.12)}
.burger{display:none;width:44px;height:44px;margin-left:auto;border:0;border-radius:10px;background:transparent;cursor:pointer;position:relative}
.burger i,.burger i::before,.burger i::after{content:"";position:absolute;left:11px;right:11px;height:2px;background:currentColor;border-radius:2px}
.burger i{top:21px}.burger i::before{left:0;right:0;top:-7px}.burger i::after{left:0;right:0;top:7px}
.drawer{position:fixed;z-index:99;left:0;right:0;top:calc(64px + env(safe-area-inset-top,0px));bottom:0;background:var(--surface);color:var(--ink);overflow:auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(-8px);opacity:0;visibility:hidden;transition:opacity .18s,transform .18s,visibility .18s}
.drawer.open{opacity:1;transform:none;visibility:visible}
.drawer .m-row{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.drawer .m-row a{flex:1;padding:14px 6px;text-decoration:none;font-weight:500}
.drawer li.act>.m-row a{color:var(--accent);font-weight:700}
.m-tg{width:44px;height:44px;border:0;background:none;cursor:pointer;font-size:14px;transition:transform .18s}
.m-tg[aria-expanded="true"]{transform:rotate(180deg)}
.m-sub{display:none;padding-left:14px}
.m-sub.open{display:block}
.drawer .m-util{display:flex;gap:16px;align-items:center;padding:18px 6px;font-size:14px;flex-wrap:wrap}

/* ---------- title band ---------- */
.tb{position:relative;overflow:hidden;background:linear-gradient(100deg,var(--band),var(--band-2));color:var(--band-ink);text-align:center;padding:30px 20px 32px}
.tb::after{content:"";position:absolute;right:max(2%,8px);top:50%;width:130px;height:150px;transform:translateY(-50%);background:var(--logo) center/contain no-repeat;opacity:.2;pointer-events:none}
.tb-in{position:relative;z-index:1;max-width:1080px;margin:0 auto}
.crumb{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;font-size:13px;opacity:.78;margin-bottom:4px}
.crumb a{text-decoration:none}.crumb a:hover{text-decoration:underline}
.tb h1{font:700 clamp(26px,4vw,38px)/1.25 var(--serif);letter-spacing:.02em}
.wrap{max-width:1080px;margin:0 auto;padding:44px 20px 80px}

/* ---------- image blocks ---------- */
.pic{position:relative;overflow:hidden;background:var(--surface-2)}
.pic>img{width:100%;height:100%;object-fit:cover;display:block;user-select:none}
.ph{position:absolute;inset:0;background:linear-gradient(135deg,#0F2E58,#1D62AC)}
.ph::after{content:"";position:absolute;inset:14% 0;background:var(--logo) center/contain no-repeat;opacity:.3}
.pic-btn{position:absolute;right:8px;bottom:8px;z-index:8;border:0;border-radius:999px;padding:6px 12px;font:600 12px var(--sans);background:rgba(8,20,40,.78);color:#fff;cursor:pointer}
.pic-btn:hover{background:var(--accent)}

/* ---------- home banner ---------- */
.bn{position:relative;overflow:hidden;background:#06142B;--bn-h:clamp(240px,34vw,400px)}
.bn.h-s{--bn-h:clamp(200px,24vw,280px)}
.bn.h-l{--bn-h:clamp(300px,44vw,540px)}
.bn-track{display:flex;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.bn-slide{position:relative;flex:0 0 100%;height:var(--bn-h);overflow:hidden}
.bn-slide .bn-img{position:absolute;inset:0}
.bn-slide::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(5,16,36,.74),rgba(5,16,36,.05) 68%)}
.bn .ph::after{inset:6% 6% 6% auto;width:34%;background-position:right center}
.bn-copy{position:absolute;z-index:3;left:max(24px,8%);right:24%;bottom:16%;color:#fff;display:grid;gap:10px;justify-items:start}
.bn-title{font:700 clamp(28px,5vw,54px)/1.15 var(--serif);text-shadow:0 2px 18px rgba(0,0,0,.4)}
.bn-text{font-size:clamp(14px,1.6vw,18px);max-width:34em;opacity:.95}
.bn-arrow{position:absolute;z-index:5;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(6,20,43,.5);color:#fff;cursor:pointer;font-size:18px}
.bn-arrow:hover{background:rgba(36,120,214,.9)}
.bn-arrow.p{left:14px}.bn-arrow.n{right:14px}
.dots{position:absolute;z-index:5;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:8px}
.dots button{width:9px;height:9px;padding:0;border-radius:999px;border:0;background:rgba(255,255,255,.5);cursor:pointer;transition:width .2s,background .2s}
.dots button[aria-current="true"]{width:28px;background:#fff}
.bn-ed{position:absolute;z-index:7;left:12px;right:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bn-bar{position:absolute;z-index:7;left:12px;bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:999px;background:var(--accent);color:var(--accent-ink);border:0;font:600 14px/1.2 var(--sans);cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface-2);color:var(--ink)}
.btn.dg{background:var(--danger);color:#fff}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.6)}
.btn.off{background:var(--surface-2);color:var(--ink-2);cursor:default;filter:none}
.btn.sm{padding:6px 12px;font-size:12px}

/* ---------- home tiles ---------- */
.cards{max-width:1080px;margin:0 auto;padding:56px 20px 84px;display:grid;gap:24px;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
.tile{position:relative;min-height:240px;border-radius:8px;background:linear-gradient(165deg,var(--tile-a),var(--tile-b));color:#F2F8FF;padding:26px;overflow:hidden;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.tile>*{position:relative;z-index:2}
.tile .t-bg{position:absolute;inset:0;z-index:0}
.tile .t-bg .ph{background:transparent}
.tile .t-bg .ph::after{inset:auto 10px 10px auto;width:90px;height:100px;opacity:.14}
.tile.hasbg::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(6,22,46,.5),rgba(6,22,46,.86))}
.tile h3{font:700 22px/1.3 var(--serif)}
.tile p{font-size:15px;opacity:.94}
.tile .more{position:static;margin-top:auto;font-size:14px;font-weight:600;text-decoration:none;align-self:flex-start;border-bottom:1px solid rgba(255,255,255,.55)}
.tile .more::after{content:"";position:absolute;inset:0;z-index:3}
.news-l li{display:flex;gap:12px;justify-content:space-between;border-top:1px solid rgba(255,255,255,.2)}
.news-l li:first-child{border-top:0}
.news-l button{all:unset;box-sizing:border-box;flex:1;min-width:0;display:flex;gap:12px;justify-content:space-between;padding:9px 0;cursor:pointer;font-size:14px}
.news-l button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news-l time{font-size:12px;opacity:.7;flex:none}
.news-l button:hover span:first-child{text-decoration:underline}
.prof dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px}
.prof dt{opacity:.72}
.prof dd a{text-decoration:underline}
.empty{color:var(--ink-2);text-align:center;padding:48px 0}
.tile .empty{color:inherit;opacity:.7;padding:8px 0;text-align:left}
.hidden-sec{opacity:.45;outline:2px dashed var(--ink-2);outline-offset:-2px}

/* ---------- boards ---------- */
.bar{display:flex;justify-content:flex-end;margin-bottom:16px}
.board{border-top:2px solid var(--ink)}
.brow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:16px;align-items:center;width:100%;text-align:left;padding:16px 10px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.brow:hover{background:var(--surface-2)}
.brow .bt{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow time{font-size:13px;color:var(--ink-2)}
.tag{display:inline-block;justify-self:start;font-size:12px;font-weight:600;padding:3px 11px;border-radius:999px;background:var(--surface-2);color:var(--accent)}
.post .tag{margin-bottom:8px}
.post h2{font:700 clamp(22px,3vw,28px)/1.35 var(--serif);margin-bottom:6px}
.post .meta{color:var(--ink-2);font-size:13px;margin-bottom:20px;display:flex;gap:10px;align-items:center}
.post .pic{border-radius:8px;aspect-ratio:16/9;margin-bottom:20px}
.post-body{white-space:pre-wrap;line-height:1.85}

/* ---------- text page ---------- */
.doc{max-width:760px;margin:0 auto;display:grid;gap:20px}
.blk{position:relative}
.blk-h h2{font:700 26px/1.4 var(--serif);padding-top:14px}
.blk-p p{white-space:pre-wrap;line-height:1.9}
.blk-img .pic{border-radius:8px;aspect-ratio:16/9}
.blk-img figcaption{font-size:13px;color:var(--ink-2);text-align:center;margin-top:8px}
.add-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}

/* ---------- guilds ---------- */
.guilds{display:flex;justify-content:center;align-items:stretch;gap:80px;padding:12px 0}
.gcard{position:relative;flex:0 1 340px;display:grid;gap:14px}
.gcard+.gcard::before{content:"";position:absolute;left:-40px;top:-6%;bottom:-6%;width:2px;background:var(--line)}
.gcard .g-img{aspect-ratio:1/1;border-radius:8px;box-shadow:var(--shadow)}
.gcard h2{font:700 24px/1.3 var(--serif);text-align:center}
.gcard .cnt{text-align:center;color:var(--ink-2);font-size:14px;margin-top:-8px}
.g-open{position:absolute;inset:0;z-index:3;border-radius:8px}
.editing .g-open{display:none}

/* ---------- roster slider ---------- */
.slider{position:relative}
.sl-view{overflow:hidden}
.sl-track{display:flex;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.sl-page{flex:0 0 100%;display:grid;gap:22px;grid-template-columns:repeat(var(--c),minmax(0,1fr));align-content:start;padding:2px}
.cc{position:relative;border-radius:8px;overflow:hidden;background:var(--tile-b);box-shadow:var(--shadow);aspect-ratio:16/10}
.cc .pic{position:absolute;inset:0}
.cc-meta{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:32px 16px 12px;color:#fff;background:linear-gradient(0deg,rgba(4,14,32,.86),transparent);display:grid}
.cc-meta strong{font:700 18px/1.3 var(--serif)}
.cc-meta span{font-size:13px;opacity:.85}
.cc-open{position:absolute;inset:0;z-index:4;border:0;background:transparent;cursor:pointer;border-radius:8px}
.cc:hover .pic>img{transform:scale(1.04)}
.cc .pic>img{transition:transform .35s}
.cc-add{aspect-ratio:16/10;border:2px dashed var(--ink-2);border-radius:8px;background:transparent;color:var(--ink-2);cursor:pointer;font-weight:600}
.cc-add:hover{border-color:var(--accent);color:var(--accent)}
.sl-arrow{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;z-index:5}
.sl-arrow.p{left:-23px}.sl-arrow.n{right:-23px}
.sl-dots{display:flex;gap:8px;justify-content:center;margin-top:24px}
.sl-dots button{width:9px;height:9px;padding:0;border:0;border-radius:999px;background:var(--line);cursor:pointer;transition:width .2s,background .2s}
.sl-dots button[aria-current="true"]{width:28px;background:var(--accent)}

/* ---------- download / faq / gallery ---------- */
.dl-list{display:grid;gap:14px;max-width:820px;margin:0 auto}
.dl{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;align-items:center;padding:20px 22px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.dl h3{font:700 19px/1.4 var(--serif)}
.dl p{color:var(--ink-2);font-size:14px}
.dl .dm{display:flex;gap:10px;font-size:12px;color:var(--ink-2);margin-top:2px}
.dl .ed-in{grid-column:1/-1}
.faq{max-width:820px;margin:0 auto;border-top:2px solid var(--ink)}
.faq-item{position:relative;border-bottom:1px solid var(--line)}
.faq-q{display:flex;align-items:center;gap:12px;padding:18px 8px;cursor:pointer;font-weight:700}
.faq-q span{flex:1}
.faq-tg{width:34px;height:34px;flex:none;border:0;border-radius:50%;background:var(--surface-2);cursor:pointer;transition:transform .2s}
.faq-item.open .faq-tg{transform:rotate(180deg)}
.faq-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s}
.faq-item.open .faq-a{grid-template-rows:1fr}
.faq-a>div{overflow:hidden}
.faq-a p{padding:0 8px 20px;white-space:pre-wrap;color:var(--ink-2)}
.gal{display:grid;gap:16px;grid-template-columns:repeat(var(--c,3),minmax(0,1fr))}
.gal figure{position:relative;margin:0}
.gal .pic{aspect-ratio:4/3;border-radius:8px}
.gal figcaption{font-size:13px;color:var(--ink-2);margin-top:6px}
.gal-open{position:absolute;inset:0;border:0;background:transparent;cursor:zoom-in;z-index:3}
.editing .gal-open{display:none}
.lb{text-align:center}
.lb .pic{max-height:70vh;aspect-ratio:4/3;border-radius:8px;background:#000}
.lb .pic>img{object-fit:contain}
.lb p{margin-top:12px;color:var(--ink-2)}

/* ---------- footer ---------- */
.ft{border-top:1px solid var(--line);padding:28px 20px 36px;text-align:center;color:var(--ink-2);font-size:13px}
.ft strong{display:block;font:700 15px var(--serif);color:var(--ink);margin-bottom:4px}

/* ---------- modals ---------- */
.ov{position:fixed;inset:0;z-index:120;background:rgba(3,10,24,.62);display:grid;place-items:center;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.dlg{position:relative;width:min(880px,100%);background:var(--surface);color:var(--ink);border-radius:14px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.dlg.sm{width:min(460px,100%)}
.x{position:absolute;right:12px;top:12px;width:40px;height:40px;border:0;border-radius:50%;background:var(--surface-2);cursor:pointer;font-size:20px;line-height:1;z-index:5}
.x:hover{background:var(--line)}
.cd-top{display:grid;justify-items:center;gap:8px;margin-bottom:26px}
.mode{position:relative;width:156px;height:46px;border-radius:999px;border:2px solid var(--start);background:var(--surface);cursor:pointer;padding:0;overflow:hidden}
.mode i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--start);transition:transform .22s}
.mode[aria-checked="false"] i{transform:translateX(100%)}
.mode span{position:absolute;top:0;bottom:0;width:50%;display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.06em;transition:color .22s}
.mode .l{left:0;color:#fff}.mode .r{right:0;color:var(--start)}
.mode[aria-checked="false"] .l{color:var(--start)}.mode[aria-checked="false"] .r{color:#fff}
.mode-cap{font-size:14px;color:var(--ink-2)}
.cd-body{display:grid;grid-template-columns:minmax(200px,280px) minmax(0,1fr);gap:34px;align-items:start;animation:swap .28s}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cd-photo .pic{aspect-ratio:5/6;border-radius:8px}
.kv{display:grid;gap:14px}
.kv>div{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:baseline}
.kv dt{font-size:13px;color:var(--ink-2)}
.kv dd{white-space:pre-wrap;min-height:1.5em}
.kv .nick{font:700 24px/1.3 var(--serif)}
.prompt{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.pr-tg{display:flex;align-items:center;gap:10px;border:0;background:none;padding:6px 0;cursor:pointer;font-weight:700}
.pr-tg::after{content:"";width:8px;height:8px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s;margin-top:-4px}
.pr-tg[aria-expanded="true"]::after{transform:rotate(-135deg);margin-top:4px}
.pr-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s}
.pr-body.open{grid-template-rows:1fr}
.pr-body>div{overflow:hidden}
.pr-body p{white-space:pre-wrap;padding:8px 0 4px;color:var(--ink-2);line-height:1.85}
.dlg .dg-row{display:flex;justify-content:flex-end;margin-top:22px}

/* ---------- toast ---------- */
.toast-root{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:400;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;display:flex;gap:14px;align-items:center;background:#0B1B33;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:min(520px,100%);animation:swap .2s}
.toast button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:13px}

/* ---------- editor ---------- */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:130;border:0;border-radius:999px;padding:14px 22px;background:var(--start);color:#fff;font:700 15px var(--sans);box-shadow:var(--shadow);cursor:pointer}
.panel{position:fixed;z-index:150;top:0;right:0;bottom:0;width:var(--panel-w);display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.12);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.p-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.p-h strong{font:700 17px var(--serif)}
.p-stat{margin-left:auto;font-size:12px;color:var(--ink-2)}
.p-stat.d{color:var(--danger);font-weight:700}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font:500 12px var(--sans);cursor:pointer;white-space:nowrap}
.chip:hover:not(:disabled){background:var(--surface-2)}
.chip:disabled{opacity:.35;cursor:default}
.chip.dg{color:var(--danger);border-color:var(--danger)}
.p-tabs{display:flex;border-bottom:1px solid var(--line)}
.p-tabs button{flex:1;padding:11px 0;border:0;background:none;cursor:pointer;font-weight:500;font-size:14px;border-bottom:3px solid transparent}
.p-tabs button[aria-selected="true"]{font-weight:700;border-bottom-color:var(--accent);color:var(--accent)}
.p-b{flex:1;overflow:auto;padding:16px}
.p-b h3{font:700 14px var(--sans);margin:18px 0 8px}
.p-b h3:first-child{margin-top:0}
.p-b .hint{font-size:12px;color:var(--ink-2);line-height:1.6;margin:6px 0 10px}
.p-f{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.p-f .btn{flex:1}
.panel.min .p-tabs,.panel.min .p-b,.panel.min .p-f{display:none}
.ed-in{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:400 13px/1.4 var(--sans)}
select.ed-in{padding-right:4px}
.fld{display:grid;gap:4px;margin-bottom:10px;font-size:12px;color:var(--ink-2)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:8px}
.mrow{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:var(--bg)}
.mrow .mrow{margin:8px 0 0 12px;background:var(--surface)}
.mline{display:grid;grid-template-columns:1fr 120px;gap:6px;margin-bottom:6px}
.mbtns{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--bg);font-size:13px}
.lrow span{display:flex;gap:4px}
.linksel{display:grid;gap:6px;min-width:200px;max-width:100%}
.tools{position:absolute;z-index:9;top:8px;right:8px;display:flex;gap:4px;padding:4px;background:rgba(8,20,40,.82);border-radius:999px}
.tools button{border:0;background:transparent;color:#fff;font:600 12px var(--sans);padding:4px 9px;border-radius:999px;cursor:pointer}
.tools button:hover:not(:disabled){background:rgba(255,255,255,.22)}
.tools button:disabled{opacity:.3;cursor:default}
.tools button.dg{color:#FFB4A8}
.bn-ed .tools{position:static}
.dock{position:fixed;z-index:250;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 24px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.35);padding:14px 16px;display:grid;gap:10px}
.dock-h{display:flex;justify-content:space-between;align-items:center}
.dock-b{display:flex;gap:8px;flex-wrap:wrap}
.dock label{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;font-size:13px}
.dock input[type=range]{width:100%}
.conf-b{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.dlg textarea.ed-in{min-height:180px;font-family:ui-monospace,monospace;font-size:12px}

/* editing state */
.editing [data-bind]{outline:1px dashed rgba(36,120,214,.6);outline-offset:3px;border-radius:3px;cursor:text;min-width:2em;min-height:1.2em}
.editing [data-bind]:focus{outline:2px solid var(--accent);background:rgba(36,120,214,.08)}
.editing [data-bind]:empty::before{content:attr(data-ph);opacity:.5}
.editing .tile [data-bind],.editing .bn-copy [data-bind]{outline-color:rgba(255,255,255,.7)}
.editing .tile [data-bind]:focus,.editing .bn-copy [data-bind]:focus{background:rgba(255,255,255,.14);outline-color:#fff}

/* ---------- responsive ---------- */
@media (min-width:1100px){
  body.editing.panel-open{padding-right:var(--panel-w)}
  body.editing.panel-open .ov{right:var(--panel-w)}
}
@media (max-width:1099px){
  .panel{top:auto;left:0;width:auto;height:min(56vh,520px);border-left:0;border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(0,0,0,.18);padding-top:0}
  .panel.min{height:auto}
  body.editing.panel-open{padding-bottom:calc(min(56vh,520px) + 12px)}
  .fab{right:calc(14px + env(safe-area-inset-right,0px))}
}
@media (max-width:959px){
  .nav,.util{display:none}
  .hd-in{height:64px;padding-left:14px;gap:8px}
  .brand img{height:50px}
  .burger{display:block}
  .start{padding:0 20px;font-size:16px}
  .start{margin-left:0}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bn-copy{right:8%}
}
@media (max-width:700px){
  .cd-body{grid-template-columns:1fr;gap:20px}
  .cd-photo{max-width:260px;margin:0 auto;width:100%}
  .dlg{padding:22px 18px}
  .guilds{gap:48px;flex-direction:row}
  .gcard+.gcard::before{left:-24px}
  .sl-arrow.p{left:-8px}.sl-arrow.n{right:-8px}
  .gal{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brow{grid-template-columns:auto minmax(0,1fr);gap:6px 12px}
  .brow time{grid-column:2}
}
@media (max-width:560px){
  .cards{grid-template-columns:1fr}
  .guilds{gap:36px}
  .tb::after{display:none}
  .dl{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

.faq-item>.tools,.dl>.tools{top:-14px}
.tile.news .more::after{display:none}
</style>

/* ---------------- path helpers ---------------- */
function base(path){
  if(path.indexOf('n:')===0){const i=path.indexOf('.');const f=findNode(path.slice(2,i));return {o:f&&f.node,p:path.slice(i+1)};}
  return {o:S,p:path};
}
function getP(path){const b=base(path);if(!b.o)return undefined;return b.p.split('.').reduce((o,k)=>o==null?o:o[k],b.o);}
function setP(path,val){
  const b=base(path);if(!b.o)return;const ks=b.p.split('.');let o=b.o;
  for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]];}
  o[ks[ks.length-1]]=val;
}
function findNode(id,list,parent,depth){
  list=list||S.menu;depth=depth||1;
  for(let i=0;i<list.length;i++){
    const n=list[i];
    if(n.id===id)return {node:n,arr:list,idx:i,parent:parent||null,depth:depth};
    if(n.children&&n.children.length){const r=findNode(id,n.children,n,depth+1);if(r)return r;}
  }
  return null;
}
function pathTo(id,list,acc){
  list=list||S.menu;acc=acc||[];
  for(const n of list){
    if(n.id===id)return acc.concat([n]);
    const r=pathTo(id,n.children||[],acc.concat([n]));if(r)return r;
  }
  return null;
}
function flatNodes(list,depth,out){list=list||S.menu;depth=depth||0;out=out||[];list.forEach(n=>{out.push({n:n,d:depth});flatNodes(n.children||[],depth+1,out)});return out;}
function height(n){return 1+Math.max(0,...(n.children||[]).map(height));}
function resolveNode(n){while(n&&n.type==='none'&&n.children&&n.children.length)n=n.children[0];return n;}
function ensure(node){
  const c=S.content[node.id]||(S.content[node.id]={});
  if(node.type==='board'&&!c.posts)c.posts=[];
  if(node.type==='text'&&!c.blocks)c.blocks=[];
  if(node.type==='gallery'){if(!c.items)c.items=[];if(!c.cols)c.cols=3;}
  if(node.type==='roster'){if(!c.chars)c.chars=[];if(!c.cols)c.cols=3;if(!c.rows)c.rows=2;}
  if(node.type==='download'&&!c.items)c.items=[];
  if(node.type==='faq'&&!c.items)c.items=[];
  if(!node.cover)node.cover=img();
  if(!node.children)node.children=[];
  return c;
}

const imgStyle=im=>{const x=im.x==null?50:im.x,y=im.y==null?50:im.y,z=im.z||1;return 'object-position:'+x+'% '+y+'%;transform:scale('+z+');transform-origin:'+x+'% '+y+'%';};
function IMG(path,cls,o){

  const inner=src?'<img src="'+src+'" alt="'+esc(o.alt||'')+'" style="'+imgStyle(im)+'" draggable="false">':'<div class="ph"></div>';
  const btn=(editing&&!o.noedit)?'<button type="button" class="pic-btn" data-act="img" data-path="'+path+'">사진 편집</button>':'';

/* roster */
function bp(){const w=window.innerWidth;return w<560?0:w<900?1:2;}
function effCols(c){const w=window.innerWidth;return w<560?1:w<900?Math.min(c,2):c;}
function rosterHTML(node,c){
  const cols=effCols(c.cols||3),per=cols*(c.rows||2),p='content.'+node.id+'.chars';
  const items=c.chars.map((ch,i)=>{
    const ip=p+'.'+i+'.ingame';
    return '<div class="cc">'+IMG(ip+'.img','',{noedit:true})+'<div class="cc-meta"><strong>'+esc(ch.ingame.nick)+'</strong><span>'+esc(ch.ingame.cls)+(ch.ingame.level?' · Lv.'+esc(ch.ingame.level):'')+'</span></div>'
      +'<button type="button" class="cc-open" data-act="opench" data-id="'+node.id+'" data-i="'+i+'" aria-label="'+esc(ch.ingame.nick)+' 프로필 보기"></button>'+TOOLS(p,i,c.chars.length,'캐릭터','h')+'</div>';
  });
  if(editing)items.push('<button type="button" class="cc-add" data-act="add" data-kind="char" data-id="'+node.id+'">＋ 캐릭터 추가</button>');
  if(!items.length)return '<p class="empty">아직 캐릭터가 없어요.</p>';
  const pages=[];for(let i=0;i<items.length;i+=per)pages.push(items.slice(i,i+per));
  const idx=clamp(ui.slide[node.id]||0,0,pages.length-1);ui.slide[node.id]=idx;
  return '<div class="slider" data-node="'+node.id+'"><div class="sl-view"><div class="sl-track" style="transform:translateX(-'+idx*100+'%)">'
    +pages.map((pg,k)=>'<div class="sl-page" style="--c:'+cols+'" role="group" aria-label="'+(k+1)+' / '+pages.length+' 페이지"'+(k!==idx?' aria-hidden="true"':'')+'>'+pg.join('')+'</div>').join('')+'</div></div>'
    +(pages.length>1?'<button type="button" class="sl-arrow p" data-act="slprev" aria-label="이전">◀</button><button type="button" class="sl-arrow n" data-act="slnext" aria-label="다음">▶</button><div class="sl-dots">'+pages.map((x,k)=>'<button type="button" data-act="slgo" data-i="'+k+'" aria-label="'+(k+1)+'페이지"'+(k===idx?' aria-current="true"':'')+'></button>').join('')+'</div>':'')+'</div>';
}
function sliderGo(i){
  const sl=$('.slider');if(!sl)return;const tr=$('.sl-track',sl);const n=tr.children.length;const id=sl.dataset.node;
  i=((i%n)+n)%n;ui.slide[id]=i;tr.style.transform='translateX(-'+i*100+'%)';
  $$('.sl-page',sl).forEach((pg,k)=>k===i?pg.removeAttribute('aria-hidden'):pg.setAttribute('aria-hidden','true'));
  $$('.sl-dots button',sl).forEach((b,k)=>k===i?b.setAttribute('aria-current','true'):b.removeAttribute('aria-current'));
}
function initSlider(){
  const v=$('.sl-view');if(!v)return;let x0=null;
  v.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
  v.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50){const cur=ui.slide[$('.slider').dataset.node]||0;sliderGo(cur+(dx<0?1:-1));}},{passive:true});
}

/* ---------------- node operations ---------------- */
function newNode(){return {id:uid(),label:'새 메뉴',type:'board',url:'',cover:img(),children:[]};}
function dropContent(n){delete S.content[n.id];(n.children||[]).forEach(dropContent);}
async function nodeOp(op,id){
  if(op==='addtop'){S.menu.push(newNode());touch();renderAll();return;}
  const f=findNode(id);if(!f)return;
  const arr=f.arr,idx=f.idx,node=f.node;
  if(op==='go'){location.hash='#/n/'+node.id;return;}
  if(op==='up'&&idx>0){const t=arr[idx-1];arr[idx-1]=arr[idx];arr[idx]=t;}
  else if(op==='down'&&idx<arr.length-1){const t=arr[idx+1];arr[idx+1]=arr[idx];arr[idx]=t;}
  else if(op==='in'&&idx>0){
    if(f.depth+height(node)>3){toast('메뉴는 3단계까지만 만들 수 있어요.');return;}
    arr.splice(idx,1);arr[idx-1].children.push(node);
  }else if(op==='out'&&f.parent){const pf=findNode(f.parent.id);arr.splice(idx,1);pf.arr.splice(pf.idx+1,0,node);}
  else if(op==='addc'){if(f.depth>=3){toast('메뉴는 3단계까지만 만들 수 있어요.');return;}node.children.push(newNode());}
  else if(op==='add'){arr.splice(idx+1,0,newNode());}
  else if(op==='del'){
    const ok=await ask('‘'+node.label+'’ 메뉴와 그 하위 메뉴, 안의 글·캐릭터가 모두 삭제돼요. 계속할까요?','삭제');
    if(!ok)return;
    arr.splice(idx,1);dropContent(node);
    if(ui.route&&!findNode(ui.route))location.hash='#/';
  }else return;
  touch();renderAll();
}

/* ---------------- images ---------------- */
function pickFiles(multi){
  return new Promise(res=>{
    const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=!!multi;i.style.display='none';
    i.onchange=()=>{res(Array.from(i.files||[]));i.remove();};
    i.addEventListener('cancel',()=>{res([]);i.remove();});
    document.body.appendChild(i);i.click();
  });
}
function fileToData(file,max,png){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const im=new Image();
    im.onload=()=>{
      let w=im.naturalWidth||max,h=im.naturalHeight||max;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);
      let d;
      if(png)d=c.toDataURL('image/png');
      else{d=c.toDataURL('image/webp',0.82);if(d.indexOf('data:image/webp')!==0){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,w,h);d=c.toDataURL('image/jpeg',0.85);}}
      URL.revokeObjectURL(url);res(d);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('image'));};
    im.src=url;
  });
}
function maxFor(path){return /home\.banner/.test(path)?1600:1100;}

function buildHTML(){

async function save(){
  const art=await use('artifact');
  if(!art||!art.publish){toast('이 화면에서는 바로 게시할 수 없어요. ‘백업 내보내기’로 저장해 두세요.');return;}
  try{
    touchDraftNow();
    await art.publish(buildHTML());
    dirty=false;toast('게시했어요.');
  }catch(e){
    const c=e&&e.code;
    if(c==='conflict')toast('다른 곳에서 먼저 게시되어 화면을 새로 불러와요.');
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required')toast('이 페이지를 수정할 권한이 없어요. 읽기 전용 화면이에요.');
    else if(c==='too_large')toast('데이터가 너무 커요. 사진 수를 줄이거나 크기를 줄여 주세요.');
    else if(c==='rate_limited')toast('잠시 후 다시 저장해 주세요.');
    else toast('저장하지 못했어요. 변경 내용은 이 브라우저에 임시 저장돼 있어요.');
  }
}

    case 'export':exportData();break;
    case 'import':importData();break;
    case 'reset':ask('모든 메뉴·글·캐릭터가 처음 예시 상태로 돌아가요. 계속할까요?','처음 상태로').then(ok=>{if(!ok)return;const lg=S.site.logo;S=mkDefault(lg);ui.route=null;location.hash='#/';touch();renderAll();});break;
  }
});
function addItem(d){
  const k=d.kind;
  if(k==='post'){const c=S.content[d.id];c.posts.unshift({id:uid(),title:'새 글',date:today(),tag:'공지',body:'',img:img()});touch();keepScroll(renderPage);ui.modal={type:'post',nodeId:d.id,i:0};renderModal();return;}
  if(k==='block-h'){S.content[d.id].blocks.push({id:uid(),t:'h',text:'새 소제목',img:img()});}
  else if(k==='block-p'){S.content[d.id].blocks.push({id:uid(),t:'p',text:'',img:img()});}
  else if(k==='block-img'){S.content[d.id].blocks.push({id:uid(),t:'img',text:'',img:img()});}
  else if(k==='gal'){
    pickFiles(true).then(fs=>Promise.all(fs.map(f=>fileToData(f,1100,false)))).then(list=>{
      if(!list.length)return;list.forEach(src=>S.content[d.id].items.push({id:uid(),text:'',img:{src:src,z:1,x:50,y:50}}));touch();keepScroll(renderPage);
    }).catch(()=>toast('이미지를 읽지 못했어요.'));return;}
  else if(k==='char'){
    const c=S.content[d.id];c.chars.push({id:uid(),ingame:{img:img(),nick:'새 캐릭터',cls:'',level:'',note:'',prompt:''},real:{img:img(),nick:'',sns:'',intro:'',note:''}});
    touch();keepScroll(renderPage);ui.modal={type:'char',nodeId:d.id,i:c.chars.length-1,mode:'ingame',prompt:true};renderModal();return;}
  else if(k==='faq'){S.content[d.id].items.push({id:uid(),q:'새 질문',a:'답변을 입력하세요.'});}
  else if(k==='dl'){S.content[d.id].items.push({id:uid(),name:'새 파일',desc:'',platform:'Windows',size:'',url:''});}
  else if(k==='bslide'){S.home.banner.slides.push({img:img(),title:'새 배너',text:'',link:''});ui.ban=S.home.banner.slides.length-1;}
  else if(k==='hcard-news'){const b=flatNodes().find(x=>x.n.type==='board');S.home.cards.push({id:uid(),type:'news',title:'새소식',src:b?b.n.id:'',count:4});}
  else if(k==='hcard-text'){S.home.cards.push({id:uid(),type:'text',title:'새 카드',body:'',img:img(),link:''});}
  else if(k==='hcard-profile'){S.home.cards.push({id:uid(),type:'profile',title:'정보',rows:[{label:'항목',value:'값',url:''}]});}
  else if(k==='prow'){S.home.cards[+d.i].rows.push({label:'항목',value:'값',url:''});}
  touch();keepScroll(renderAll);
}
function banGo(i){
  const B=S.home.banner,n=B.slides.length;if(!n)return;i=((i%n)+n)%n;ui.ban=i;
  const tr=$('#bn-track');if(tr)tr.style.transform='translateX(-'+i*100+'%)';
  $$('.dots button').forEach((b,k)=>k===i?b.setAttribute('aria-current','true'):b.removeAttribute('aria-current'));
}
function initHome(){
  const tr=$('#bn-track');if(tr)tr.style.transform='translateX(-'+ui.ban*100+'%)';
  const B=S.home.banner;
  if(B.auto&&!editing&&!reduce&&B.slides.length>1){
    timers.ban=setInterval(()=>{if(!document.hidden&&!ui.modal)banGo(ui.ban+1);},Math.max(2,B.sec||5)*1000);
  }
}
function setEditing(on){
  editing=on;ui.imgEdit=null;
  if(on){ui.tab='menu';}
  renderAll();
  if(on)toast('글자를 눌러 바로 고치고, 사진 위 ‘사진 편집’으로 이미지를 바꿔 보세요.');
}

/* ---------------- boot ---------------- */
function boot(){
  const app=$('#app');
  app.innerHTML='<div id="hdr"></div><main id="page"></main><div id="ftr"></div><div id="modal-root"></div><div id="dock-root"></div><div id="panel-root"></div><div class="toast-root" id="toast-root" aria-live="polite"></div>';
  document.documentElement.style.setProperty('--logo','url("'+safeSrc(S.site.logo)+'")');
  const m=location.hash.match(/^#\/n\/(\w+)/);ui.route=m?m[1]:null;
  renderAll();
  (async()=>{
    const art=await use('artifact');const user=await use('user');
    let ok=false;
    if(user&&user.canEdit){try{ok=!!(await user.canEdit());}catch(e){ok=false;}}else ok=!!art;
    canEdit=ok;renderPanel();
    if(ok){
      try{
        const dr=localStorage.getItem(DRAFT_KEY);
        if(dr&&dr!==JSON.stringify(S)){
          toast('저장하지 않은 임시본이 있어요.',{label:'임시본 불러오기',fn:()=>{try{const d=JSON.parse(dr);if(d&&d.v===1){S=d;dirty=true;setEditing(true);}}catch(e){}}});
        }
      }catch(e){}
    }
  })();
}
boot();
})();
</script>
</body>
</html>
